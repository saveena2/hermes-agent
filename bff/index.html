<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Friendship Day</title>

<style>
body{
    margin:0;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:linear-gradient(135deg,#ffd6e7,#fff7c0,#d6f5ff);
    font-family:Arial,sans-serif;
}

.card{
    width:350px;
    padding:25px;
    background:white;
    border-radius:20px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,.2);
}

h1{
    color:#ff4081;
}

.name{
    color:#7b1fa2;
    font-size:28px;
    font-weight:bold;
}

.flower{
    font-size:50px;
    animation:float 2s ease-in-out infinite;
}

@keyframes float{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-10px);}
}

.letter{
    margin-top:20px;
    background:#fff8dc;
    padding:15px;
    border-radius:15px;
    color:#444;
    line-height:1.6;
}

button{
    margin-top:20px;
    padding:10px 20px;
    border:none;
    border-radius:20px;
    background:#ff4081;
    color:white;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#e91e63;
}
</style>
</head>

<body>

<div class="card">
<div class="flower">🌸🌷🌹🌼</div>

<h1>Happy Friendship Day!</h1>

<div class="name">Dear Shaima 💖</div>

<div class="letter">
Thank you for being such an amazing friend. 🌸<br><br>
Your kindness, laughter, and support make every day brighter.
I hope our friendship stays beautiful forever. 💕<br><br>
Wishing you happiness, success, and endless smiles.
Happy Friendship Day, Shaima! 🌷✨
</div>

<button onclick="alert('Happy Friendship Day, Shaima! 💖🌸')">
Click for a Surprise 🎁
</button>

</div>

</body>
</html>
